    <!-- Manifiesto de Aplicación Web integrado (PWA) para habilitar el botón de instalación en Chrome/Edge -->

    <!-- Script de registro opcional de Service Worker para asegurar la instalación sin fallos -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
            self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => {})));
          `;
          const blob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(blob))
            .catch(err => console.log('SW Registration skipped/failed', err));
        });
      }
    </script>
